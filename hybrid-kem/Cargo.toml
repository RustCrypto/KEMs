[package]
name = "hybrid-kem"
description = "Pure Rust implementation of the Concrete Hybrid PQ/T Key Encapsulation Mechanisms"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
readme = "README.md"
homepage = "https://github.com/RustCrypto/KEMs/tree/master/hybrid-kem"
repository = "https://github.com/RustCrypto/KEMs/tree/master/hybrid-kem"
categories = ["cryptography", "no-std"]
keywords = ["crypto", "hybrid-kem", "kem", "post-quantum"]
exclude = ["tests/mlkem768-p256.json", "tests/mlkem1024-p384.json"]

[features]
default = ["x-wing"]
x-wing = ["dep:x-wing"]
getrandom = ["kem/getrandom"]
zeroize = ["dep:zeroize", "ml-kem/zeroize", "sha3/zeroize", "shake/zeroize", "x-wing?/zeroize"]
hazmat = []

[dependencies]
elliptic-curve = { version = "0.14.1", default-features = false, features = ["sec1"] }
kem = "0.3"
ml-kem = { version = "0.3", default-features = false, features = ["hazmat"] }
p256 = { version = "0.14", default-features = false, features = ["ecdh", "pem"] }
p384 = { version = "0.14", default-features = false, features = ["ecdh", "pem"] }
sha3 = { version = "0.12", default-features = false }
shake = { version = "0.1", default-features = false }
x-wing = { version = "0.1", default-features = false, optional = true }

# optional dependencies
zeroize = { version = "1.8.1", optional = true, default-features = true }

[dev-dependencies]
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = { version = "0.4", features = ["serde"] }
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
